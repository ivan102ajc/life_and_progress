<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Древо жизни</title>
  <meta name="description" content="Игра для саморазвития: реальные полезные дела растят твоё дерево, а вредные привычки заставляют листья желтеть.">
  <meta name="theme-color" content="#E9F0E6">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loading" class="loading"><div class="loader-seed"></div><p>Поливаем дерево…</p></div>

  <section id="auth" class="auth" hidden></section>

  <div id="game" class="game" hidden>
    <header id="topbar" class="topbar"></header>
    <main class="layout">
      <section class="scene-wrap" aria-label="Дерево">
        <div id="tree" class="scene"></div>
        <div id="scene-caption" class="scene-caption"></div>
      </section>
      <section class="side">
        <nav id="tabs" class="tabs" aria-label="Разделы">
          <button data-action="tab" data-tab="tree">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-7M12 14l-4-3M12 12l4-3"/><path d="M12 3a6 6 0 0 1 6 6c0 3-2.5 5-6 5s-6-2-6-5a6 6 0 0 1 6-6z"/></svg>
            <span>Дерево</span>
          </button>
          <button data-action="tab" data-tab="log">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>
            <span>Отметить</span>
          </button>
          <button data-action="tab" data-tab="skills">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V10"/><path d="M12 13c-4 0-6-2.5-6-6 3.5 0 6 2 6 6zM12 10c0-3.5 2.5-6 6-6 0 3.5-2 6-6 6z"/></svg>
            <span>Навыки</span>
          </button>
          <button data-action="tab" data-tab="materials">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg>
            <span>Материалы</span>
          </button>
          <button data-action="tab" data-tab="history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>
            <span>История</span>
          </button>
        </nav>
        <div id="panel" class="panel"></div>
      </section>
    </main>
  </div>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script>
    // Загрузчик. Современные браузеры получают js/app.js, старые (например,
    // встроенный браузер Telegram на старом планшете) — совместимую версию.
    // Если игра не запустилась, вместо пустого экрана показываем причину.
    (function () {
      var ru = /^(ru|uk|be|kk)/i.test(navigator.language || '');
      try { var saved = localStorage.getItem('tol_lang'); if (saved) ru = saved === 'ru'; } catch (e) {}
      window.__bootFail = function (reason, detail) {
        if (window.__appStarted || window.__bootShown) return;
        window.__bootShown = true;
        var box = document.getElementById('loading');
        if (!box) return;
        box.hidden = false;
        box.innerHTML =
          '<p class="error-text">' + (ru
            ? 'Не удалось запустить игру. Возможные причины: нет интернета, сайт заблокирован у провайдера (попробуйте VPN) или устарел встроенный браузер — обновите Telegram и «Android System WebView» в Play Маркете.'
            : 'The game could not start. Possible reasons: no internet, the site is blocked by your provider (try a VPN), or the built-in browser is outdated — update Telegram and “Android System WebView” in the Play Store.') + '</p>' +
          '<button class="btn" onclick="location.reload()">' + (ru ? 'Попробовать снова' : 'Try again') + '</button>' +
          '<p class="boot-details">' + reason + (detail ? ': ' + String(detail).slice(0, 160) : '') + '<br>' + navigator.userAgent + '</p>';
        // Сообщаем разработчику, что игра не запустилась (без личных данных).
        try {
          var x = new XMLHttpRequest();
          x.open('POST', '/api/report');
          x.setRequestHeader('Content-Type', 'application/json');
          x.send(JSON.stringify({ message: 'Boot failed: ' + reason + (detail ? ': ' + String(detail).slice(0, 200) : ''), where: 'boot' }));
        } catch (e) {}
      };
      window.addEventListener('error', function (e) { window.__bootFail('error', e.message); });
      setTimeout(function () { window.__bootFail('timeout'); }, 20000);

      var modern = false;
      try {
        new Function('var a = {}; return a?.b ?? 1')();
        modern = 'noModule' in document.createElement('script');
      } catch (e) { modern = false; }
      if (/[?&]legacy=1/.test(location.search)) modern = false;
      var s = document.createElement('script');
      if (modern) { s.type = 'module'; s.src = '/js/app.js'; } else { s.src = '/js/app.legacy.js'; }
      s.onerror = function () { window.__bootFail('load', s.src); };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
