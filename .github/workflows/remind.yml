# Ежечасный запуск напоминаний игрокам.
# Бесплатный тариф Vercel умеет запускать задачи только раз в сутки, поэтому
# ежечасный «будильник» живёт здесь, в GitHub Actions (это бесплатно).
# Каждый час этот workflow дёргает наш адрес /api/admin?task=remind, а сервер
# сам решает, кому именно сейчас пора напомнить — по часовому поясу игрока.
#
# Что нужно один раз настроить:
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  CRON_SECRET
#     Value: та же длинная случайная строка, что добавлена в Vercel
#            (Settings → Environment Variables → CRON_SECRET).

name: Напоминания игрокам

on:
  schedule:
    - cron: '0 * * * *'   # каждый час
  workflow_dispatch:       # и можно запустить вручную кнопкой

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Позвать сервер разослать напоминания
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Секрет ещё не задан — просто пропускаем, без ошибки и без письма.
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET не задан — пропускаю. Добавь его в Settings → Secrets репозитория и в Vercel, и напоминания заработают."
            exit 0
          fi
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X GET \
            "https://life-and-progress.vercel.app/api/admin?task=remind" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"; cat /tmp/out; echo
          # Падаем (и шлём письмо) только если сервер ответил не 200 —
          # это уже настоящая проблема, которую стоит заметить.
          test "$code" = "200"
